[project]
name = "chakravyuh"
version = "0.1.0"
description = "Offline two-layer attribution workstation for Bitcoin traffic (SIH26146)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "polars==1.17.1",
  "duckdb==1.1.3",
  "pyarrow==18.1.0",
  "rustworkx==0.15.1",
  "lightgbm==4.5.0",
  "mapie==0.9.1",
  "shap==0.46.0",
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chakravyuh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "T20"]

[tool.ruff.lint.per-file-ignores]
# T20 bans print() repo-wide so no stage can dump data to stdout.
# These three are the only sanctioned writers to stdout in the project.
"scripts/peek.py" = ["T20"]
"scripts/make_fixtures.py" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "mapie.*", "rustworkx.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
