[project]
name = "chakravyuh"
version = "0.1.0"
description = "Offline attribution and investigation workstation for Bitcoin traffic."
requires-python = ">=3.11,<3.12"
dependencies = [
  "polars==1.17.1",
  "pyarrow==18.1.0",
  "rustworkx==0.15.1",
  "lightgbm==4.5.0",
  "mapie==0.9.1",
  "shap==0.46.0",
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chakravyuh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "T20"]

[tool.ruff.lint.per-file-ignores]
# T20 bans print() repo-wide so no stage can dump data to stdout.
# These four are the only sanctioned writers to stdout in the project. compare_runs.py prints
# file names and field names to stderr, never a row.
"scripts/peek.py" = ["T20"]
"scripts/make_fixtures.py" = ["T20"]
"scripts/compare_runs.py" = ["T20"]
"scripts/announcements_per_tx.py" = ["T20"]
# stage_time.py prints its one STAGE_RESULT measurement line to stderr (T201's print
# calls there carry file=sys.stderr); it measures other commands and writes no data.
"scripts/stage_time.py" = ["T20"]
# demo_smoke.py prints check results to stdout and one FAIL line to stderr; it is the S11
# cold-start gate's reporter and writes no data rows, only pass/fail status.
"scripts/demo_smoke.py" = ["T20"]
# generate_headlines.py prints its before/after headline counts so a run that stopped varying
# the prose is visible; it writes prose into one fixture, never a data row.
"scripts/generate_headlines.py" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "mapie.*", "rustworkx.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers so a typo in a marker name is an error rather than a silent deselection.
# `make verify-quarantine` selects on the marker below, and a marker that does not exist would
# turn that gate green while running nothing.
addopts = "-q --strict-markers"
markers = [
  "quarantine: leakage gates. Registered in tests/conftest.py, run by `make verify-quarantine`, which every stage calls.",
]
